name: Deploy Hugo site to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        run: |
          npm install -g wrangler@3
          for i in 1 2 3; do
            echo "尝试 $i..."
            if wrangler pages deploy public --project-name=my-blog --branch=production; then
              echo "部署成功"
              break
            else
              echo "部署失败，10秒后重试..."
              sleep 10
            fi
          done