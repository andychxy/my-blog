[params.injector]
head_end = """<style>
:root {
  --grey-9: #555555;
  --grey-7: #333333;
  --color-default: #222222;
  --color-meta-shadow: rgba(0, 0, 0, 0.15);
  --color-red-6-shadow: rgba(0, 0, 0, 0.15);
  --color-red-3-shadow: rgba(0, 0, 0, 0.1);
  --color-h2-after: #16213e;
  --color-link: #1a56a8;
  --color-background: #e5e5e5;
  /* Override dark navy colors for better readability */
  --red-0: #2a4a7f;
  --red-1: #1e5aa8;
  --red-2: #3a6ab5;
}
/* Light mode */
body { background-color: #e5e5e5; color: #1a1a1a; }
#wrap, #main { background-color: #f5f5f5; }
#main-nav a, .nav-icon { color: #2a4a7f !important; }
.site-title { color: #1a1a2e !important; }
.article-title { color: #1a1a2e !important; }
.article-meta { color: #555; }
a { color: #1a56a8; }
a:hover { color: #1e40af; }
#sidebar { background-color: #f0f0f0; }
#sidebar h3 { color: #333; }
footer { background-color: #e0e0e0; color: #444; }

/* ====== Dark mode overrides — bright text for readability ====== */
[data-theme="dark"] {
  body, #wrap, #main { background-color: #121212 !important; color: #e8e8e8 !important; }
  #sidebar { background-color: #1a1a1a !important; color: #e0e0e0 !important; }
  #sidebar h3 { color: #e0e0e0 !important; }
  .site-title { color: #f0f0f0 !important; }
  .article-title, h1, h2, h3, h4, h5, h6 { color: #f5f5f5 !important; }
  .article-meta, .article-info { color: #aaaaaa !important; }
  a { color: #7ab3ff !important; }
  a:hover { color: #a8cfff !important; }
  #main-nav a, .nav-icon { color: #a8cfff !important; }
  footer { background-color: #1a1a1a !important; color: #999 !important; }
  /* Sidebar links */
  #sidebar a { color: #c0d0e0 !important; }
  #sidebar a:hover { color: #e0f0ff !important; }
  /* Article card background */
  .article-card { background-color: #1e1e1e !important; }
  .article-card .article-title { color: #f0f0f0 !important; }
  .article-card .article-excerpt { color: #b0b0b0 !important; }
  /* Tag/category pills */
  .tag, .category { background-color: #2a2a2a !important; color: #d0d0d0 !important; border-color: #3a3a3a !important; }
  /* Code blocks */
  pre, code { background-color: #1a1a1a !important; color: #e0e0e0 !important; }
  /* Borders and dividers */
  .article-card { border-color: #2a2a2a !important; }
  /* Archive year label */
  .archive-year { color: #d0d0d0 !important; }
  /* Scrollbar */
  ::-webkit-scrollbar-track { background: #1a1a1a; }
  ::-webkit-scrollbar-thumb { background: #444; }
}
</style>

