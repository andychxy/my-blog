[languages.en]
languageName = "English"
languageCode = "en"
weight = 2
title = "Andy's Analysis"
description = "Interdisciplinary analysis of Artificial Intelligence and Global Geopolitics"
params.languageAltTitle = "中文"

[taxonomies]
category = "categories"
tag = "tags"